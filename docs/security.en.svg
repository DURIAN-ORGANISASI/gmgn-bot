<svg xmlns="http://www.w3.org/2000/svg" width="960" height="370" viewBox="0 0 960 370" role="img" aria-label="Two important risks to understand"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#100F1D"/><stop offset="1" stop-color="#211A2C"/></linearGradient><linearGradient id="line"><stop stop-color="#FFC786"/><stop offset="1" stop-color="#FF9A7A"/></linearGradient></defs><rect width="960" height="370" rx="24" fill="url(#bg)"/><path d="M0 5H960" stroke="url(#line)" stroke-width="5"/><text x="38" y="44" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="800" letter-spacing="2" fill="#FFC786">SECURITY / READ BEFORE USE</text><text x="38" y="76" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="800" fill="#FFF7F0">Two important risks to understand</text><text x="38" y="100" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#D8BDAF">Protect credentials and understand the platform policy risk.</text><rect x="38" y="122" width="427" height="211" rx="17" fill="#171828" stroke="#51405A"/><circle cx="76" cy="160" r="21" fill="#30283A" stroke="#A58BC1"/><rect x="67" y="153" width="18" height="15" rx="3" fill="none" stroke="#D9C3F0" stroke-width="2"/><path d="M71 153v-5a5 5 0 0 1 10 0v5" fill="none" stroke="#D9C3F0" stroke-width="2"/><text x="112" y="156" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="800" fill="#F7F4FB">Protect the account token</text><text x="112" y="177" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" fill="#B7A8C7">Credential security</text><path d="M62 196H441" stroke="#3C3347"/><circle cx="67" cy="218" r="3.5" fill="#D9C3F0"/><text x="82" y="222" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" fill="#E1D8EA">Store the token in Railway Variables.</text><circle cx="67" cy="246" r="3.5" fill="#D9C3F0"/><text x="82" y="250" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" fill="#E1D8EA">Never commit secrets or share logs.</text><circle cx="67" cy="274" r="3.5" fill="#D9C3F0"/><text x="82" y="278" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" fill="#E1D8EA">Rotate the token if exposed.</text><rect x="62" y="295" width="166" height="22" rx="11" fill="#30283A" stroke="#665070"/><text x="145" y="310" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9" font-weight="800" fill="#E3D1F3">KEEP SECRETS PRIVATE</text><rect x="495" y="122" width="427" height="211" rx="17" fill="#211A25" stroke="#785342"/><circle cx="533" cy="160" r="21" fill="#3B2B2A" stroke="#C58D68"/><path d="M533 147l14 25h-28z" fill="none" stroke="#FFD19A" stroke-width="2" stroke-linejoin="round"/><path d="M533 155v8M533 167v1" stroke="#FFD19A" stroke-width="2" stroke-linecap="round"/><text x="569" y="156" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="800" fill="#FFF7F0">Self-bot policy warning</text><text x="569" y="177" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" fill="#D6A993">Account restriction risk</text><path d="M519 196H898" stroke="#52372F"/><text x="519" y="221" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" fill="#F0D7C8">This project automates a user account.</text><text x="519" y="245" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" fill="#F0D7C8">Self-bots violate Discord's Terms of Service.</text><text x="519" y="269" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" fill="#F0D7C8">Use can lead to account restrictions.</text><rect x="519" y="292" width="240" height="25" rx="10" fill="#3C2A26" stroke="#8B5D47"/><text x="639" y="308" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9" font-weight="800" fill="#FFD0A2">UNDERSTAND BEFORE DEPLOYING</text></svg>