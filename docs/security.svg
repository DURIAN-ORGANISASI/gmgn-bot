<svg xmlns="http://www.w3.org/2000/svg" width="960" height="370" viewBox="0 0 960 370" role="img" aria-label="Token security and Discord self-bot policy warning"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#100F1D"/><stop offset="1" stop-color="#211A2C"/></linearGradient><linearGradient id="amber"><stop stop-color="#FFD18A"/><stop offset="1" stop-color="#FF9A7A"/></linearGradient></defs><rect width="960" height="370" rx="24" fill="url(#bg)"/><rect x="0" y="0" width="8" height="370" rx="4" fill="url(#amber)"/><text x="38" y="41" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="800" letter-spacing="2" fill="#FFC786">SECURITY / READ BEFORE USE</text><text x="38" y="73" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="800" fill="#FFF7F0">Two important risks to understand</text><rect x="38" y="102" width="427" height="231" rx="17" fill="#171828" stroke="#51405A"/><circle cx="76" cy="141" r="21" fill="#30283A" stroke="#A58BC1"/><rect x="67" y="135" width="18" height="15" rx="3" fill="none" stroke="#D9C3F0" stroke-width="2"/><path d="M71 135v-5a5 5 0 0 1 10 0v5" fill="none" stroke="#D9C3F0" stroke-width="2"/><text x="112" y="137" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="800" fill="#F7F4FB">Protect the account token</text><text x="112" y="158" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" fill="#B7A8C7">Credential security</text><path d="M62 183H441" stroke="#3C3347"/><circle cx="67" cy="208" r="3.5" fill="#D9C3F0"/><text x="82" y="212" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#E1D8EA">Store the token in Railway Variables.</text><circle cx="67" cy="238" r="3.5" fill="#D9C3F0"/><text x="82" y="242" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#E1D8EA">Never commit secrets or share logs.</text><circle cx="67" cy="268" r="3.5" fill="#D9C3F0"/><text x="82" y="272" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#E1D8EA">Rotate credentials if exposed.</text><rect x="62" y="295" width="157" height="22" rx="11" fill="#30283A" stroke="#665070"/><text x="140" y="310" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="800" fill="#E3D1F3">KEEP SECRETS PRIVATE</text><rect x="495" y="102" width="427" height="231" rx="17" fill="#211A25" stroke="#785342"/><circle cx="533" cy="141" r="21" fill="#3B2B2A" stroke="#C58D68"/><path d="M533 128l14 25h-28z" fill="none" stroke="#FFD19A" stroke-width="2" stroke-linejoin="round"/><path d="M533 136v8M533 148v1" stroke="#FFD19A" stroke-width="2" stroke-linecap="round"/><text x="569" y="137" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="800" fill="#FFF7F0">Self-bot policy warning</text><text x="569" y="158" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" fill="#D6A993">Account restriction risk</text><path d="M519 183H898" stroke="#52372F"/><text x="519" y="210" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#F0D7C8">This project automates a user account.</text><text x="519" y="232" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#F0D7C8">Self-bots violate Discord's Terms of Service.</text><text x="519" y="254" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#F0D7C8">Use can lead to account restrictions.</text><rect x="519" y="282" width="234" height="35" rx="10" fill="#3C2A26" stroke="#8B5D47"/><text x="636" y="304" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="800" fill="#FFD0A2">UNDERSTAND BEFORE DEPLOYING</text></svg>