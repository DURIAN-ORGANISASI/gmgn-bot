<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">Privacy and security boundaries</title><desc id="desc">Documentation diagram showing secrets, persistent configuration, and Discord platform risk.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0A101D"/><stop offset="1" stop-color="#171B32"/></linearGradient><linearGradient id="accent"><stop stop-color="#6679F4"/><stop offset="1" stop-color="#4BD3E2"/></linearGradient><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#9DB0D6" fill-opacity=".1"/></pattern></defs><rect width="1200" height="430" rx="22" fill="url(#bg)"/><rect width="1200" height="430" rx="22" fill="url(#dots)"/><rect x="1" y="1" width="1198" height="428" rx="21" fill="none" stroke="#2B3D57"/><text x="40" y="48" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="900" fill="#4BD3E2" text-anchor="start">PRIVACY &amp; SECURITY</text><text x="40" y="84" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="900" fill="#F5F7FC" text-anchor="start">Know where secrets and configuration live.</text><rect x="38" y="118" width="356" height="205" rx="17" fill="#19253A" stroke="#334760"/><rect x="55" y="136" width="39" height="39" rx="11" fill="#6679F4" fill-opacity=".16" stroke="#6679F4" stroke-opacity=".65"/><text x="74.5" y="160" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9" font-weight="900" fill="#6679F4" text-anchor="middle">01</text><text x="107" y="160" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="900" fill="#F5F7FC" text-anchor="start">SECRETS</text><path d="M56 188H376" stroke="#30435F"/><circle cx="63" cy="218" r="3.5" fill="#6679F4"/><text x="76" y="222" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#A7B5CD" text-anchor="start">Discord token</text><circle cx="63" cy="248" r="3.5" fill="#6679F4"/><text x="76" y="252" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#A7B5CD" text-anchor="start">Railway environment</text><circle cx="63" cy="278" r="3.5" fill="#6679F4"/><text x="76" y="282" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#A7B5CD" text-anchor="start">Never commit credentials</text><rect x="422" y="118" width="356" height="205" rx="17" fill="#19253A" stroke="#334760"/><rect x="439" y="136" width="39" height="39" rx="11" fill="#43D6A4" fill-opacity=".16" stroke="#43D6A4" stroke-opacity=".65"/><text x="458.5" y="160" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9" font-weight="900" fill="#43D6A4" text-anchor="middle">02</text><text x="491" y="160" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="900" fill="#F5F7FC" text-anchor="start">CONFIGURATION</text><path d="M440 188H760" stroke="#30435F"/><circle cx="447" cy="218" r="3.5" fill="#43D6A4"/><text x="460" y="222" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#A7B5CD" text-anchor="start">/data/config.json</text><circle cx="447" cy="248" r="3.5" fill="#43D6A4"/><text x="460" y="252" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#A7B5CD" text-anchor="start">Target IDs + schedule</text><circle cx="447" cy="278" r="3.5" fill="#43D6A4"/><text x="460" y="282" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#A7B5CD" text-anchor="start">Persist with a Volume</text><rect x="806" y="118" width="356" height="205" rx="17" fill="#19253A" stroke="#334760"/><rect x="823" y="136" width="39" height="39" rx="11" fill="#A898FF" fill-opacity=".16" stroke="#A898FF" stroke-opacity=".65"/><text x="842.5" y="160" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9" font-weight="900" fill="#A898FF" text-anchor="middle">03</text><text x="875" y="160" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="900" fill="#F5F7FC" text-anchor="start">PLATFORM RISK</text><path d="M824 188H1144" stroke="#30435F"/><circle cx="831" cy="218" r="3.5" fill="#A898FF"/><text x="844" y="222" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#A7B5CD" text-anchor="start">Uses a user-account token</text><circle cx="831" cy="248" r="3.5" fill="#A898FF"/><text x="844" y="252" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#A7B5CD" text-anchor="start">Self-bots violate Discord ToS</text><circle cx="831" cy="278" r="3.5" fill="#A898FF"/><text x="844" y="282" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#A7B5CD" text-anchor="start">Use official APIs where possible</text><rect x="38" y="348" width="1124" height="49" rx="12" fill="#342622" stroke="#734B3C"/><text x="60" y="378" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="800" fill="#F3C66D" text-anchor="start">Never publish a real token, password, or private key.</text></svg>