ejoin="round"/><rect x="734" y="141" width="188" height="143" rx="16" fill="#101B30" stroke="#354A6A"/><text x="752" y="166" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9" font-weight="800" letter-spacing="1.5" fill="#A8C9FF">DELIVERY</text><text x="752" y="202" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="800" fill="#F5F7FF">Target channels</text><path d="M752 219H904" stroke="#2E415E"/><text x="752" y="244" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" fill="#A8B8D5">GM / GN messages</text><rect x="38" y="305" width="884" height="30" rx="15" fill="#17263C" stroke="#344A69"/><circle cx="56" cy="320" r="4" fill="#7BE0C3"/><text x="69" y="324" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" fill="#B7C7E0">A Railway Volume mounted at /data is required to keep configuration after restarts.</text></svg>