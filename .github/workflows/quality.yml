name: Quality checks

on:
  push:
    branches: [main]
    paths:
      - "README*.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "docs/**"
      - "src/**"
      - "scripts/**"
      - "pyproject.toml"
      - "requirements*.txt"
      - ".github/workflows/quality.yml"
  pull_request:
    paths:
      - "README*.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "docs/**"
      - "src/**"
      - "scripts/**"
      - "pyproject.toml"
      - "requirements*.txt"
      - ".github/workflows/quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Lint, compile, and validate documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Check code style
        run: |
          ruff check .
          ruff format --check .
      - name: Compile Python modules
        run: python -m compileall -q src
      - name: Validate Markdown references and SVG files
        run: python scripts/check_docs.py
