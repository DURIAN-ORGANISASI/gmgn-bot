<text x="38" y="44" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="800" letter-spacing="2" fill="#79E0D4">OVERVIEW / ARCHITECTURE</text>
<text x="38" y="76" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="800" fill="#F5F7FF">One worker, from command to delivery</text>
<text x="38" y="100" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#A5B5D2">Configuration persists on a volume; the worker runs the schedule.</text>
