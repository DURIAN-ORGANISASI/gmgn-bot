ght="30" rx="8" fill="#14233B" stroke="#304663"/><text x="108" y="264" font-family="ui-monospace,Consolas,monospace" font-size="11" font-weight="800" fill="#80DED2">!set</text><text x="196" y="264" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" fill="#C0CCE1">Add target channels</text><rect x="348" y="245" width="240" height="30" rx="8" fill="#14233B" stroke="#304663"/><text x="360" y="264" font-family="ui-monospace,Consolas,monospace" font-size="11" font-weight="800" fill="#80DED2">!time</text><text x="448" y="264" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" fill="#C0CCE1">Set GM / GN times</text><rect x="600" y="245" width="240" height="30" rx="8" fill="#14233B" stroke="#304663"/><text x="612" y="264" font-family="ui-monospace,Consolas,monospace" font-size="11" font-weight="800" fill="#80DED2">!list</text><text x="700" y="264" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" fill="#C0CCE1">View configuration</text><rect x="96" y="285" width="240" height="30" rx="8" fill="#14233B" stroke="#304663"/><text x="108" y="304" font-family="ui-monospace,Consolas,monospace" font-size="11" font-weight="800" fill="#FFC786">!stop</text><text x="196" y="304" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" fill="#C0CCE1">Remove a target</text><rect x="348" y="285" width="240" height="30" rx="8" fill="#14233B" stroke="#304663"/><text x="360" y="304" font-family="ui-monospace,Consolas,monospace" font-size="11" font-weight="800" fill="#FFC786">!test gm|gn</text><text x="448" y="304" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" fill="#C0CCE1">Manual test</text><rect x="600" y="285" width="240" height="30" rx="8" fill="#14233B" stroke="#304663"/><text x="612" y="304" font-family="ui-monospace,Consolas,monospace" font-size="11" font-weight="800" fill="#FFC786">!menu</text><text x="700" y="304" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" fill="#C0CCE1">Show help</text></svg>