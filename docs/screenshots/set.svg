<svg xmlns="http://www.w3.org/2000/svg" width="960" height="370" viewBox="0 0 960 370" role="img" aria-label="Set target channels example"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0C1222"/><stop offset="1" stop-color="#162541"/></linearGradient><linearGradient id="ok"><stop stop-color="#68D8C3"/><stop offset="1" stop-color="#92E6B9"/></linearGradient></defs><rect width="960" height="370" rx="24" fill="url(#bg)"/><text x="36" y="41" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="800" letter-spacing="2" fill="#89A0FF">03 / TARGETS</text><text x="36" y="73" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="800" fill="#F5F7FF">Choose where messages should go</text><rect x="36" y="100" width="414" height="230" rx="17" fill="#0A1020" stroke="#334766"/><text x="60" y="132" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="800" letter-spacing="1.3" fill="#8DA1C4">SEND THIS IN #MONITOR</text><rect x="60" y="151" width="366" height="60" rx="11" fill="#1A2A46" stroke="#415A80"/><circle cx="82" cy="181" r="6" fill="#6EE0CE"/><text x="100" y="185" font-family="ui-monospace,Consolas,monospace" font-size="15" font-weight="700" fill="#F4F7FF">!set 1234567890 0987654321</text><text x="60" y="244" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#A8B8D5">Add one or more channel IDs,</text><text x="60" y="263" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#A8B8D5">separated by spaces.</text><rect x="60" y="287" width="138" height="25" rx="12" fill="#172D34" stroke="#356B67"/><text x="129" y="303" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="800" fill="#83E6D3">COMMAND ACCEPTED</text><path d="M466 212h42m-7-7 8 7-8 7" fill="none" stroke="#76DDD0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="526" y="100" width="398" height="230" rx="17" fill="#0A1020" stroke="