<svg xmlns="http://www.w3.org/2000/svg" width="960" height="370" viewBox="0 0 960 370" role="img" aria-label="Set the morning and evening schedule"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0C1222"/><stop offset="1" stop-color="#162541"/></linearGradient><linearGradient id="sun"><stop stop-color="#FFE2A0"/><stop offset="1" stop-color="#FF9C76"/></linearGradient><linearGradient id="moon"><stop stop-color="#A8D7FF"/><stop offset="1" stop-color="#8B9CFF"/></linearGradient></defs><rect width="960" height="370" rx="24" fill="url(#bg)"/><text x="36" y="41" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="800" letter-spacing="2" fill="#89A0FF">04 / SCHEDULE</text><text x="36" y="73" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="800" fill="#F5F7FF">Set both times with one command</text><rect x="36" y="98" width="888" height="56" rx="13" fill="#0A1020" stroke="#334766"/><text x="58" y="121" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="800" letter-spacing="1.5" fill="#8DA1C4">COMMAND</text><text x="58" y="141" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="700" fill="#DDE7FF">!time gm:07.00, gn:19.00</text><rect x="36" y="178" width="427" height="151" rx="17" fill="#101B30" stroke="#3D506E"/><circle cx="91" cy="233" r="25" fill="#FFCB86" fill-opacity=".13"/><circle cx="91" cy="233" r="13" fill="url(#sun)"/><g stroke="#FFC786" stroke-width="2" stroke-linecap="round"><path d="M91 211v5M91 250v5M69 233h5M108 233h5M75 217l4 4M103 245l4 4M75 249l4-4M103 221l4-4"/></g><text x="135" y="213" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="800" letter-spacing="1.6" fill="#FFC786">GOOD MORNING</text><text x="135" y="250" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="800" fill="#F8FAFF">07:00</text><text x="135" y="275" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#A8B8D5">Timezone comes from TIMEZONE</text><rect x="497" y="178" width="427" height="151" rx="17" fill="#101B30" stroke="#3D506E"/><circle cx="552" cy="233" r="25" fill="#8BA9FF" fill-opacity=".13"/><path d="M560 214a20 20 0 1 0 0 38a17 17 0 0 1 0-38Z" fill="url(#moon)"/><text x="596" y="213" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="800" letter-spacing="1.6" fill="#AFC4FF">GOOD NIGHT</text><text x="596" y="250" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="800" fill="#F8FAFF">19:00</text><text x="596" y="275" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#A8B8D5">One setting for the daily schedule</text></svg>