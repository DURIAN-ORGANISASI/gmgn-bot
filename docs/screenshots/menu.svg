 UI,Arial,sans-serif"><rect x="95" y="249" width="240" height="28" rx="8" fill="#14233B" stroke="#304663"/><text x="108" y="267" font-family="ui-monospace,Consolas,monospace" font-size="12" font-weight="800" fill="#80DED2">!set</text><text x="165" y="267" font-size="11" fill="#C0CCE1">Add target channels</text><rect x="347" y="249" width="240" height="28" rx="8" fill="#14233B" stroke="#304663"/><text x="360" y="267" font-family="ui-monospace,Consolas,monospace" font-size="12" font-weight="800" fill="#80DED2">!time</text><text x="422" y="267" font-size="11" fill="#C0CCE1">Set GM / GN times</text><rect x="599" y="249" width="240" height="28" rx="8" fill="#14233B" stroke="#304663"/><text x="612" y="267" font-family="ui-monospace,Consolas,monospace" font-size="12" font-weight="800" fill="#80DED2">!list</text><text x="662" y="267" font-size="11" fill="#C0CCE1">View configuration</text><rect x="95" y="289" width="240" height="28" rx="8" fill="#14233B" stroke="#304663"/><text x="108" y="307" font-family="ui-monospace,Consolas,monospace" font-size="12" font-weight="800" fill="#FFC786">!stop</text><text x="165" y="307" font-size="11" fill="#C0CCE1">Remove a target</text><rect x="347" y="289" width="240" height="28" rx="8" fill="#14233B" stroke="#304663"/><text x="360" y="307" font-family="ui-monospace,Consolas,monospace" font-size="12" font-weight="800" fill="#FFC786">!test gm|gn</text><text x="454" y="307" font-size="11" fill="#C0CCE1">Manual test</text><rect x="599" y="289" width="240" height="28" rx="8" fill="#14233B" stroke="#304663"/><text x="612" y="307" font-family="ui-monospace,Consolas,monospace" font-size="12" font-weight="800" fill="#FFC786">!menu</text><text x="675" y="307" font-size="11" fill="#C0CCE1">Show help</text></g></svg>